<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050914">
  <title>KEMET RA | كيميت رع</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #102c50, #050914 65%);
      color: #f4d47a;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    header { padding: 25px 15px; }
    .ankh {
      font-size: 90px;
      color: #e7bd55;
      text-shadow: 0 0 30px #c99b37;
      margin-top: 25px;
    }
    h1 {
      font-size: 38px;
      letter-spacing: 3px;
      margin: 10px;
    }
    .subtitle {
      color: #d8dce7;
      font-size: 17px;
    }
    .pyramid {
      font-size: 85px;
      margin: 30px auto;
      color: #d6a943;
    }
    .welcome {
      max-width: 600px;
      margin: 20px auto;
      padding: 25px;
      border: 1px solid #b58c3c;
      border-radius: 16px;
      background: #0b1425;
    }
    button {
      background: linear-gradient(135deg,#e8c66e,#a87925);
      color: #07101e;
      border: none;
      padding: 15px 35px;
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;
      margin-top: 20px;
    }
    footer {
      padding: 35px 10px;
      color: #8995a9;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <header>
    <div class="ankh">☥</div>
    <h1>KEMET RA</h1>
    <div class="subtitle">كيميت رع</div>
    <div class="pyramid">𓉴</div>
  </header>

  <main class="welcome">
    <h2>بوابة الحضارة والكنوز</h2>
    <p>منصة عالمية للتحف والمقتنيات النادرة والمزادات.</p>
    <p>اكتشف التاريخ، امتلك القطع الفريدة، وشارك في عالم من الكنوز.</p>
    <button onclick="alert('مرحباً بك في KEMET RA')">
      دخول المنصة
    </button>
  </main>

  <footer>
    KEMET RA © 2026
    <br>حيث يلتقي التاريخ بالمستقبل
  </footer>
</body>
</html>
